name: Secret Scan

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Pinned tarball plus a checksum check: the previous `curl install.sh | sh` step failed with exit 127 and
      # left no usable trace once the logs aged out, so nothing here depends on a remote installer script.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          version=8.24.2
          asset="gitleaks_${version}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          cd "${RUNNER_TEMP}"
          curl -sSfL -o "${asset}" "${base}/${asset}"
          curl -sSfL -o checksums.txt "${base}/gitleaks_${version}_checksums.txt"
          grep " ${asset}\$" checksums.txt | sha256sum -c -
          sudo tar -xzf "${asset}" -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan git history for secrets
        run: gitleaks git --config .gitleaks.toml --redact --verbose

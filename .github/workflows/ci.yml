name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  # A pushed fix supersedes the run it replaces; PR runs cancel on the older head.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  client-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        run: npm install --no-audit --no-fund
        working-directory: client

      - name: Build client
        run: npm run build
        working-directory: client

  server-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate server JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          # server/ plus the bot entry points at the repository root (claude-bot.js, codex-bot.js, bot-supervisor.js).
          {
            find server -type f -name '*.js' -not -path '*/node_modules/*' -print0
            find . -maxdepth 1 -type f -name '*.js' -print0
          } | while IFS= read -r -d '' file; do
            node --check "$file"
          done

  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate CLI package can be packed
        run: npm_config_cache="${RUNNER_TEMP}/npm-cache" npm pack --dry-run
        working-directory: packages/openclawworld
